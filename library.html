<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Моя библиотека — NOCTURNE BOOKS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f6f9fd;
color:#173052;
padding-bottom:95px;
}

header{
padding:26px 18px 16px;
background:#fff;
border-bottom:1px solid #e2e9f2;
}

h1{
margin:0;
font-size:24px;
text-align:center;
}

main{
max-width:700px;
margin:auto;
padding:20px 16px;
}

.empty{
background:white;
border-radius:20px;
padding:35px 20px;
text-align:center;
color:#7b8fa7;
box-shadow:0 7px 20px rgba(39,73,110,.06);
}

.book-card{
display:none;
background:white;
border-radius:20px;
padding:14px;
box-shadow:0 7px 20px rgba(39,73,110,.07);
}

.book-inner{
display:flex;
gap:14px;
}

.cover{
width:100px;
flex-shrink:0;
}

.cover img{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
border-radius:13px;
}

.info h2{
font-size:18px;
margin:4px 0;
}

.author{
font-size:13px;
color:#8394a8;
}

.series{
font-size:11px;
color:#6f89a5;
margin:5px 0 10px;
}

.progress{
height:6px;
background:#e6edf5;
border-radius:10px;
overflow:hidden;
margin:8px 0;
}

.progress-bar{
height:100%;
background:#6f9bd0;
width:0%;
}

.button{
display:block;
background:#709bd0;
color:#fff;
text-decoration:none;
text-align:center;
padding:11px;
border-radius:11px;
font-size:12px;
font-weight:bold;
margin-top:10px;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(255,255,255,.97);
border-top:1px solid #e0e8f1;
display:flex;
justify-content:space-around;
padding:10px 3px calc(14px + env(safe-area-inset-bottom));
}

.nav-item{
text-align:center;
color:#8ca0b8;
font-size:10px;
width:20%;
text-decoration:none;
}

.nav-icon{
font-size:21px;
display:block;
margin-bottom:4px;
}

.nav-item.active{
color:#5285c3;
}
</style>
</head>

<body>

<header>
<h1>Моя библиотека</h1>
</header>

<main>

<div class="empty" id="empty">
Пока здесь пусто.<br><br>
Добавляй книги в библиотеку, чтобы быстро возвращаться к ним.
</div>

<div class="book-card" id="bookCard">

<div class="book-inner">

<div class="cover">
<img src="file_00000000751c724682f122426a67d42d.png" alt="Холодная малышка">
</div>

<div class="info">

<h2>Холодная малышка</h2>

<div class="author">
Карли Робин
</div>

<div class="series">
Бостонские Рыси · Книга #1
</div>

<div id="progressText">
Прочитано 0%
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<a class="button" href="reader.html">
📖 ПРОДОЛЖИТЬ
</a>

</div>

</div>

</div>

</main>

<nav>

<a class="nav-item" href="index.html">
<span class="nav-icon">⌂</span>
Главная
</a>

<a class="nav-item" href="catalog.html">
<span class="nav-icon">⌕</span>
Каталог
</a>

<a class="nav-item active" href="library.html">
<span class="nav-icon">♡</span>
Библиотека
</a>

<a class="nav-item" href="bookmarks.html">
<span class="nav-icon">🔖</span>
Закладки
</a>

<a class="nav-item" href="#">
<span class="nav-icon">♙</span>
Профиль
</a>

</nav>

<script>

const IN_LIBRARY =
"nocturne-cold-baby-library";

const PROGRESS_KEY =
"nocturne-cold-baby-progress";

const isInLibrary =
localStorage.getItem(IN_LIBRARY);

const empty =
document.getElementById("empty");

const bookCard =
document.getElementById("bookCard");

if(isInLibrary === "yes"){

empty.style.display="none";
bookCard.style.display="block";

const progress =
Number(localStorage.getItem(PROGRESS_KEY)) || 0;

document.getElementById("progressText").textContent =
"Прочитано " + progress + "%";

document.getElementById("progressBar").style.width =
progress + "%";

}

</script>

</body>
</html>
