<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Закладки — NOCTURNE BOOKS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f6f9fd;
color:#173052;
padding-bottom:105px;
}

header{
padding:26px 18px 16px;
background:#fff;
border-bottom:1px solid #e2e9f2;
}

h1{
margin:0;
font-size:24px;
text-align:center;
}

main{
max-width:700px;
margin:auto;
padding:20px 16px;
}

.empty{
background:#fff;
border-radius:20px;
padding:40px 20px;
text-align:center;
color:#7c8fa5;
box-shadow:0 7px 20px rgba(39,73,110,.06);
}

.card{
display:none;
background:white;
border-radius:20px;
padding:15px;
box-shadow:0 7px 20px rgba(39,73,110,.07);
}

.inner{
display:flex;
gap:14px;
}

.cover{
width:95px;
flex-shrink:0;
}

.cover img{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
border-radius:13px;
}

.info{
flex:1;
}

.info h2{
font-size:18px;
margin:3px 0 4px;
}

.author{
font-size:13px;
color:#8294a8;
}

.saved{
margin-top:12px;
padding:10px;
background:#eef4fb;
border-radius:12px;
font-size:12px;
color:#52779e;
}

.progress{
height:6px;
background:#e5edf5;
border-radius:10px;
overflow:hidden;
margin:10px 0;
}

.bar{
height:100%;
width:0%;
background:#6f9bd0;
}

.button{
display:block;
background:#709bd0;
color:white;
text-decoration:none;
text-align:center;
padding:12px;
border-radius:11px;
font-size:12px;
font-weight:bold;
margin-top:10px;
}

nav{
position:fixed;
left:0;
right:0;
bottom:0;
display:flex;
justify-content:space-around;
background:#fff;
border-top:1px solid #e0e8f1;
padding:10px 3px calc(14px + env(safe-area-inset-bottom));
z-index:99999;
}

.nav-item{
width:20%;
text-align:center;
text-decoration:none;
font-size:10px;
color:#8ca0b8;
}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:4px;
}

.nav-item.active{
color:#5285c3;
}
</style>
</head>

<body>

<header>
<h1>Закладки</h1>
</header>

<main>

<div class="empty" id="empty">
Закладок пока нет.<br><br>
Нажми 🔖 в читалке, чтобы сохранить нужное место.
</div>

<div class="card" id="card">

<div class="inner">

<div class="cover">
<img
src="file_00000000751c724682f122426a67d42d.png"
alt="Холодная малышка"
>
</div>

<div class="info">

<h2>Холодная малышка</h2>

<div class="author">
Карли Робин
</div>

<div class="saved" id="savedText">
Сохранённое место
</div>

<div class="progress">
<div class="bar" id="progressBar"></div>
</div>

<a
class="button"
href="reader.html?bookmark=1"
>
🔖 ОТКРЫТЬ ЗАКЛАДКУ
</a>

</div>

</div>

</div>

</main>

<nav>

<a class="nav-item" href="index.html">
<span class="nav-icon">⌂</span>
Главная
</a>

<a class="nav-item" href="catalog.html">
<span class="nav-icon">⌕</span>
Каталог
</a>

<a class="nav-item" href="library.html">
<span class="nav-icon">♡</span>
Библиотека
</a>

<a class="nav-item active" href="bookmarks.html">
<span class="nav-icon">🔖</span>
Закладки
</a>

<a class="nav-item" href="#">
<span class="nav-icon">♙</span>
Профиль
</a>

</nav>

<script>

const BOOKMARK_CFI =
"nocturne-cold-baby-bookmark";

const BOOKMARK_PROGRESS =
"nocturne-cold-baby-bookmark-progress";

const BOOKMARK_PAGE =
"nocturne-cold-baby-bookmark-page";

const bookmark =
localStorage.getItem(BOOKMARK_CFI);

if(bookmark){

document.getElementById("empty").style.display="none";
document.getElementById("card").style.display="block";

const progress =
Number(
localStorage.getItem(BOOKMARK_PROGRESS)
) || 0;

const page =
localStorage.getItem(BOOKMARK_PAGE)
|| "Сохранённое место";

document.getElementById("savedText").textContent =
page + " · " + progress + "%";

document.getElementById("progressBar").style.width =
progress + "%";

}

</script>

</body>
</html>
