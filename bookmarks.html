<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Закладки — NOCTURNE BOOKS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f6f9fd;
color:#173052;
padding-bottom:95px;
}

header{
padding:26px 18px 16px;
background:#fff;
border-bottom:1px solid #e2e9f2;
}

h1{
margin:0;
font-size:24px;
text-align:center;
}

main{
max-width:700px;
margin:auto;
padding:20px 16px;
}

.empty{
background:white;
border-radius:20px;
padding:35px 20px;
text-align:center;
color:#7b8fa7;
box-shadow:0 7px 20px rgba(39,73,110,.06);
}

.bookmark-card{
display:none;
background:white;
border-radius:20px;
padding:18px;
box-shadow:0 7px 20px rgba(39,73,110,.07);
}

.bookmark-card h2{
font-size:18px;
margin:0 0 6px;
}

.author{
font-size:13px;
color:#8294a8;
margin-bottom:12px;
}

.button{
display:block;
background:#709bd0;
color:#fff;
text-decoration:none;
text-align:center;
padding:11px;
border-radius:11px;
font-size:12px;
font-weight:bold;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(255,255,255,.97);
border-top:1px solid #e0e8f1;
display:flex;
justify-content:space-around;
padding:10px 3px calc(14px + env(safe-area-inset-bottom));
}

.nav-item{
text-align:center;
color:#8ca0b8;
font-size:10px;
width:20%;
text-decoration:none;
}

.nav-icon{
font-size:21px;
display:block;
margin-bottom:4px;
}

.nav-item.active{
color:#5285c3;
}
</style>
</head>

<body>

<header>
<h1>Закладки</h1>
</header>

<main>

<div class="empty" id="empty">
Закладок пока нет.
</div>

<div class="bookmark-card" id="bookmarkCard">

<h2>Холодная малышка</h2>

<div class="author">
Карли Робин
</div>

<a class="button" href="reader.html">
🔖 ОТКРЫТЬ ЗАКЛАДКУ
</a>

</div>

</main>

<nav>

<a class="nav-item" href="index.html">
<span class="nav-icon">⌂</span>
Главная
</a>

<a class="nav-item" href="catalog.html">
<span class="nav-icon">⌕</span>
Каталог
</a>

<a class="nav-item" href="library.html">
<span class="nav-icon">♡</span>
Библиотека
</a>

<a class="nav-item active" href="bookmarks.html">
<span class="nav-icon">🔖</span>
Закладки
</a>

<a class="nav-item" href="#">
<span class="nav-icon">♙</span>
Профиль
</a>

</nav>

<script>

const BOOKMARK_KEY =
"nocturne-cold-baby-bookmark";

const bookmark =
localStorage.getItem(BOOKMARK_KEY);

if(bookmark){

document.getElementById("empty").style.display="none";
document.getElementById("bookmarkCard").style.display="block";

}

</script>

</body>
</html>
