<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Цитаты — NOCTURNE BOOKS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#173052;
  padding-bottom:110px;

  background:
    radial-gradient(circle at 5% 12%,rgba(244,190,211,.38),transparent 25%),
    radial-gradient(circle at 95% 30%,rgba(187,211,238,.26),transparent 27%),
    radial-gradient(circle at 10% 65%,rgba(247,202,220,.30),transparent 29%),
    radial-gradient(circle at 90% 85%,rgba(222,197,226,.25),transparent 27%),
    linear-gradient(180deg,#fffafd,#fbf5f9 45%,#f4f8fc);

  background-attachment:fixed;
}

body::before{
  content:"❝";
  position:fixed;
  left:12px;
  top:260px;
  color:rgba(205,145,174,.15);
  font-size:25px;
  pointer-events:none;
}

body::after{
  content:"✦";
  position:fixed;
  right:14px;
  top:500px;
  color:rgba(104,151,205,.15);
  font-size:19px;
  pointer-events:none;
}

header{
  padding:26px 18px 16px;
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(221,225,235,.9);
}

h1{
  margin:0;
  text-align:center;
  font-size:24px;
}

.subtitle{
  text-align:center;
  font-size:12px;
  color:#8192a7;
  margin-top:6px;
}

main{
  max-width:700px;
  margin:auto;
  padding:20px 16px;
}

.empty{
  background:rgba(255,255,255,.90);
  border-radius:20px;
  padding:40px 20px;
  text-align:center;
  color:#7b8fa7;
}

.quote-card{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);
  border-radius:20px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:
    0 8px 22px rgba(39,73,110,.07),
    0 4px 16px rgba(218,157,185,.06);
}

.book-line{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.cover{
  width:42px;
  height:62px;
  object-fit:cover;
  border-radius:7px;
}

.book-name{
  font-size:13px;
  font-weight:bold;
}

.author{
  font-size:11px;
  color:#8192a7;
  margin-top:3px;
}

.quote{
  font-family:Georgia,serif;
  font-size:15px;
  line-height:1.6;
  color:#31465f;
  padding:14px;
  background:linear-gradient(
    135deg,
    rgba(239,246,253,.95),
    rgba(251,238,245,.92)
  );
  border-radius:14px;
}

.meta{
  font-size:11px;
  color:#7890aa;
  margin-top:10px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.open{
  flex:1;
  display:block;
  background:linear-gradient(135deg,#709bd0,#83a8d2);
  color:white;
  text-decoration:none;
  text-align:center;
  padding:11px;
  border-radius:11px;
  font-size:11px;
  font-weight:bold;
}

.delete{
  border:1px solid #d9e4ef;
  background:rgba(255,255,255,.9);
  color:#7890aa;
  border-radius:11px;
  padding:0 14px;
}

nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:space-around;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-top:1px solid #e0e8f1;
  padding:9px 3px calc(13px + env(safe-area-inset-bottom));
  z-index:999999;
}

.nav-item{
  width:20%;
  min-height:54px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  text-align:center;
  color:#8ca0b8;
  font-size:10px;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.nav-item.active{
  color:#5285c3;
}
</style>
</head>

<body>

<header>

<h1>Цитаты</h1>

<div class="subtitle">
Сохранённые фрагменты из книг
</div>

</header>

<main>

<div class="empty" id="empty">
Пока нет сохранённых цитат.<br><br>
Выдели текст в читалке и нажми «Сохранить цитату».
</div>

<div id="quotes"></div>

</main>

<nav>

<a class="nav-item" href="https://tvorchestvolana-alt.github.io/nocturne-books/index.html">
<span class="nav-icon">⌂</span>
Главная
</a>

<a class="nav-item" href="https://tvorchestvolana-alt.github.io/nocturne-books/catalog.html">
<span class="nav-icon">⌕</span>
Каталог
</a>

<a class="nav-item" href="https://tvorchestvolana-alt.github.io/nocturne-books/library.html">
<span class="nav-icon">♡</span>
Библиотека
</a>

<a class="nav-item active" href="https://tvorchestvolana-alt.github.io/nocturne-books/bookmarks.html">
<span class="nav-icon">❝</span>
Цитаты
</a>

<a class="nav-item" href="https://tvorchestvolana-alt.github.io/nocturne-books/profile.html">
<span class="nav-icon">♙</span>
Профиль
</a>

</nav>

<script>

const QUOTES_KEY="nocturne-cold-baby-quotes";

function getQuotes(){

  try{
    return JSON.parse(
      localStorage.getItem(QUOTES_KEY)
    ) || [];
  }catch(e){
    return [];
  }
}

function saveQuotes(quotes){

  localStorage.setItem(
    QUOTES_KEY,
    JSON.stringify(quotes)
  );
}

function escapeHTML(text){

  return String(text)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");
}

function render(){

  const quotes=getQuotes();
  const container=document.getElementById("quotes");
  const empty=document.getElementById("empty");

  container.innerHTML="";

  if(quotes.length===0){

    empty.style.display="block";
    return;
  }

  empty.style.display="none";

  quotes.forEach(quote=>{

    const card=document.createElement("div");

    card.className="quote-card";

    const safeText=
    escapeHTML(quote.text || "");

    card.innerHTML=`

<div class="book-line">

<img
class="cover"
src="file_00000000751c724682f122426a67d42d.png"
alt="Холодная малышка"
>

<div>

<div class="book-name">
Холодная малышка
</div>

<div class="author">
Карли Робин
</div>

</div>

</div>

<div class="quote">
«${safeText}»
</div>

<div class="meta">
${quote.progress || 0}% книги
</div>

<div class="actions">

<a
class="open"
href="https://tvorchestvolana-alt.github.io/nocturne-books/reader.html?quote=${quote.id}"
>
ПЕРЕЙТИ К ЦИТАТЕ
</a>

<button
class="delete"
data-id="${quote.id}"
>
Удалить
</button>

</div>

`;

    container.appendChild(card);

  });

  document
  .querySelectorAll(".delete")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      const id=String(button.dataset.id);

      const updated=
      getQuotes()
      .filter(
        quote=>String(quote.id)!==id
      );

      saveQuotes(updated);
      render();

    });

  });

}

render();

</script>

</body>
</html>
