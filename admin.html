<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Админка — NOCTURNE BOOKS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#173052;

  background:
    radial-gradient(circle at 10% 15%,rgba(244,190,211,.35),transparent 28%),
    radial-gradient(circle at 90% 30%,rgba(187,211,238,.28),transparent 30%),
    linear-gradient(180deg,#fffafd,#f6f8fc);

  min-height:100vh;
  padding-bottom:50px;
}

header{
  padding:25px 18px;
  text-align:center;
  background:rgba(255,255,255,.9);
  border-bottom:1px solid #e4eaf1;
}

.logo{
  font-family:Georgia,serif;
  font-size:30px;
  font-weight:900;
  letter-spacing:5px;
  color:#31577f;
}

.subtitle{
  margin-top:7px;
  font-size:11px;
  letter-spacing:3px;
  color:#8395a9;
}

main{
  max-width:760px;
  margin:auto;
  padding:22px 16px;
}

.back{
  display:inline-block;
  margin-bottom:17px;
  text-decoration:none;
  color:#52779e;
  font-size:14px;
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:22px;
  padding:20px;
  margin-bottom:19px;
  box-shadow:0 10px 30px rgba(43,69,101,.08);
}

h2{
  margin:0 0 18px;
  font-size:20px;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:13px;
  font-weight:bold;
  color:#557391;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #dbe5ef;
  border-radius:14px;
  padding:13px 14px;
  font-size:15px;
  outline:none;
  background:#fbfdff;
  color:#173052;
}

textarea{
  min-height:140px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#8bb0d8;
}

.password-row{
  display:flex;
  gap:9px;
}

.password-row input{
  flex:1;
}

.secondary{
  border:0;
  border-radius:14px;
  padding:0 17px;
  background:#eaf2fb;
  color:#52779e;
  font-weight:bold;
  cursor:pointer;
}

.file-box{
  border:1px dashed #bfcfe0;
  border-radius:16px;
  padding:16px;
  background:#f9fbfe;
}

.file-box input{
  border:0;
  padding:0;
  background:transparent;
}

.file-info{
  margin-top:8px;
  color:#8999aa;
  font-size:11px;
}

.current-file{
  margin-top:8px;
  font-size:11px;
  color:#5d7d9c;
}

.primary{
  width:100%;
  margin-top:20px;
  border:0;
  border-radius:15px;
  padding:15px;
  background:linear-gradient(135deg,#709bd0,#d49ab5);
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.cancel-edit{
  width:100%;
  margin-top:10px;
  border:1px solid #d5e1ec;
  border-radius:15px;
  padding:13px;
  background:#fff;
  color:#63809e;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  display:none;
}

.cancel-edit.show{
  display:block;
}

.status{
  display:none;
  margin-top:14px;
  padding:12px 13px;
  border-radius:12px;
  font-size:13px;
}

.status.show{
  display:block;
}

.status.success{
  background:#edf8f1;
  color:#35744c;
}

.status.error{
  background:#fff0f2;
  color:#a84656;
}

.status.loading{
  background:#eef5fc;
  color:#52779e;
}

.book-list{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.book-item{
  display:flex;
  gap:14px;
  padding:14px;
  border:1px solid #e3eaf2;
  border-radius:17px;
  background:#fafcff;
}

.book-cover{
  width:70px;
  height:105px;
  object-fit:cover;
  border-radius:9px;
  background:#eaf0f6;
  flex-shrink:0;
}

.no-cover{
  width:70px;
  height:105px;
  border-radius:9px;
  background:#eaf0f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  flex-shrink:0;
}

.book-data{
  flex:1;
  min-width:0;
}

.book-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:5px;
}

.book-author{
  font-size:12px;
  color:#8393a5;
  margin-bottom:7px;
}

.book-category{
  display:inline-block;
  padding:5px 8px;
  border-radius:11px;
  background:linear-gradient(135deg,#eaf2fb,#f8eaf1);
  color:#5d7d9c;
  font-size:10px;
}

.epub-link{
  display:block;
  margin-top:9px;
  font-size:11px;
  color:#52779e;
  text-decoration:none;
}

.book-actions{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.edit{
  border:0;
  background:#edf4fb;
  color:#52779e;
  border-radius:11px;
  padding:9px 11px;
  font-size:11px;
  cursor:pointer;
}

.delete{
  border:0;
  background:#fff0f2;
  color:#b94d60;
  border-radius:11px;
  padding:9px 11px;
  font-size:11px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#8a9aad;
  padding:30px 10px;
  font-size:13px;
}

.small{
  margin-top:8px;
  color:#96a4b3;
  font-size:10px;
}

.editing-note{
  display:none;
  margin-bottom:14px;
  padding:10px 12px;
  border-radius:12px;
  background:#eef5fc;
  color:#52779e;
  font-size:12px;
  font-weight:bold;
}

.editing-note.show{
  display:block;
}
</style>
</head>

<body>

<header>
  <div class="logo">NOCTURNE</div>
  <div class="subtitle">ADMIN PANEL</div>
</header>

<main>

<a class="back" href="index.html">
  ← Вернуться на сайт
</a>


<div class="card">

  <h2>🔐 Доступ</h2>

  <label>Админ-пароль</label>

  <div class="password-row">

    <input
      id="adminKey"
      type="password"
      placeholder="Введите пароль"
    >

    <button
      class="secondary"
      id="savePassword"
      type="button"
    >
      Запомнить
    </button>

  </div>

  <div class="small">
    Пароль сохраняется только в этом браузере.
  </div>

</div>


<div class="card">

  <h2 id="formTitle">
    ➕ Добавить книгу
  </h2>

  <div
    class="editing-note"
    id="editingNote"
  >
    ✏️ Режим редактирования
  </div>

  <label>Название</label>

  <input
    id="title"
    type="text"
    placeholder="Название книги"
  >


  <label>Автор</label>

  <input
    id="author"
    type="text"
    placeholder="Имя автора"
  >


  <label>Категория</label>

  <select id="category">

    <option value="">
      Выберите категорию
    </option>

    <option value="Триллеры/детективы">
      Триллеры/детективы
    </option>

    <option value="Хорроры">
      Хорроры
    </option>

    <option value="Сплаттерпанки">
      Сплаттерпанки
    </option>

    <option value="Дарк Романы">
      Дарк Романы
    </option>

    <option value="Дарк Фэнтези">
      Дарк Фэнтези
    </option>

    <option value="Хоккейный роман">
      Хоккейный роман
    </option>

    <option value="Спортивный роман">
      Спортивный роман
    </option>

    <option value="Студенческий роман">
      Студенческий роман
    </option>

  </select>


  <label>Аннотация</label>

  <textarea
    id="description"
    placeholder="Вставьте аннотацию книги..."
  ></textarea>


  <label>Обложка</label>

  <div class="file-box">

    <input
      id="coverFile"
      type="file"
      accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
    >

    <div class="file-info">
      JPG, JPEG, PNG или WEBP
    </div>

    <div
      class="current-file"
      id="currentCoverInfo"
    ></div>

  </div>


  <label>EPUB</label>

  <div class="file-box">

    <input
      id="bookFile"
      type="file"
      accept=".epub,application/epub+zip"
    >

    <div class="file-info">
      Выберите готовый файл EPUB
    </div>

    <div
      class="current-file"
      id="currentBookInfo"
    ></div>

  </div>


  <button
    class="primary"
    id="saveBook"
    type="button"
  >
    ДОБАВИТЬ КНИГУ
  </button>


  <button
    class="cancel-edit"
    id="cancelEdit"
    type="button"
  >
    ОТМЕНИТЬ РЕДАКТИРОВАНИЕ
  </button>


  <div
    class="status"
    id="status"
  ></div>

</div>


<div class="card">

  <h2>📚 Книги в базе</h2>

  <div
    id="bookList"
    class="book-list"
  >
    Загрузка...
  </div>

</div>

</main>


<script>

const API_URL =
  "https://nocturne-books-api.tvorchestvolana.workers.dev";


const adminKeyInput =
  document.getElementById("adminKey");

const statusBox =
  document.getElementById("status");

const bookList =
  document.getElementById("bookList");

const saveBookButton =
  document.getElementById("saveBook");

const cancelEditButton =
  document.getElementById("cancelEdit");

const editingNote =
  document.getElementById("editingNote");

const formTitle =
  document.getElementById("formTitle");

const currentCoverInfo =
  document.getElementById("currentCoverInfo");

const currentBookInfo =
  document.getElementById("currentBookInfo");


let booksCache = [];

let editingBookId = null;

let editingCoverUrl = "";

let editingBookUrl = "";


adminKeyInput.value =
  localStorage.getItem("nocturne-admin-key") || "";


/* СОХРАНИТЬ ПАРОЛЬ */

document
  .getElementById("savePassword")
  .addEventListener(
    "click",
    () => {

      const key =
        adminKeyInput.value.trim();

      if (!key) {

        showStatus(
          "Введите пароль.",
          "error"
        );

        return;
      }

      localStorage.setItem(
        "nocturne-admin-key",
        key
      );

      showStatus(
        "Пароль сохранён ✓",
        "success"
      );

    }
  );


/* СТАТУС */

function showStatus(text, type) {

  statusBox.textContent = text;

  statusBox.className =
    "status show " + type;
}


/* ЗАГРУЗКА ФАЙЛА */

async function uploadFile(
  file,
  type,
  adminKey
) {

  if (!file) {
    return "";
  }

  const extension =
    file.name.includes(".")
      ? file.name
          .split(".")
          .pop()
          .toLowerCase()
      : "";

  const safeName =
    type === "cover"
      ? "cover." + extension
      : "book.epub";

  const response =
    await fetch(
      API_URL +
      "/upload?type=" +
      type,
      {
        method: "POST",

        headers: {
          "X-Admin-Key":
            adminKey,

          "X-File-Name":
            safeName,

          "X-File-Type":
            file.type ||
            "application/octet-stream",

          "Content-Type":
            file.type ||
            "application/octet-stream"
        },

        body: file
      }
    );

  const result =
    await response.json();

  if (!response.ok) {

    throw new Error(
      result.error ||
      result.details ||
      "Ошибка загрузки файла"
    );
  }

  return result.url;
}


/* СОХРАНИТЬ КНИГУ */

saveBookButton.addEventListener(
  "click",
  async () => {

    const adminKey =
      adminKeyInput
        .value
        .trim();

    if (!adminKey) {

      showStatus(
        "Сначала введите админ-пароль.",
        "error"
      );

      return;
    }


    const title =
      document
        .getElementById("title")
        .value
        .trim();

    const author =
      document
        .getElementById("author")
        .value
        .trim();

    const category =
      document
        .getElementById("category")
        .value;

    const description =
      document
        .getElementById("description")
        .value
        .trim();

    const coverFile =
      document
        .getElementById("coverFile")
        .files[0];

    const bookFile =
      document
        .getElementById("bookFile")
        .files[0];


    if (
      !title ||
      !author ||
      !category
    ) {

      showStatus(
        "Заполните название, автора и категорию.",
        "error"
      );

      return;
    }


    saveBookButton.disabled =
      true;


    try {

      let coverUrl =
        editingCoverUrl;

      let bookUrl =
        editingBookUrl;


      if (coverFile) {

        showStatus(
          "Загружаю новую обложку...",
          "loading"
        );

        coverUrl =
          await uploadFile(
            coverFile,
            "cover",
            adminKey
          );
      }


      if (bookFile) {

        showStatus(
          "Загружаю новый EPUB...",
          "loading"
        );

        bookUrl =
          await uploadFile(
            bookFile,
            "book",
            adminKey
          );
      }


      if (editingBookId) {

        showStatus(
          "Сохраняю изменения...",
          "loading"
        );


        const response =
          await fetch(
            API_URL +
            "/books/" +
            editingBookId,
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json",

                "X-Admin-Key":
                  adminKey
              },

              body:
                JSON.stringify({
                  title,
                  author,
                  category,
                  description,
                  cover_url: coverUrl,
                  book_url: bookUrl
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            result.details ||
            "Не удалось сохранить изменения"
          );
        }


        showStatus(
          "Изменения сохранены ✓",
          "success"
        );


      } else {

        showStatus(
          "Сохраняю книгу в базе...",
          "loading"
        );


        const response =
          await fetch(
            API_URL + "/books",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "X-Admin-Key":
                  adminKey
              },

              body:
                JSON.stringify({
                  title,
                  author,
                  category,
                  description,
                  cover_url: coverUrl,
                  book_url: bookUrl
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            result.details ||
            "Не удалось добавить книгу"
          );
        }


        showStatus(
          "Книга добавлена в базу ✓",
          "success"
        );

      }


      resetForm();

      await loadBooks();


    } catch (error) {

      showStatus(
        error.message,
        "error"
      );

    } finally {

      saveBookButton.disabled =
        false;

    }

  }
);


/* ЗАГРУЗИТЬ КНИГИ */

async function loadBooks() {

  bookList.innerHTML =
    "Загрузка...";

  try {

    const response =
      await fetch(
        API_URL + "/books"
      );

    const books =
      await response.json();

    if (!response.ok) {

      throw new Error(
        books.error ||
        "Ошибка загрузки"
      );
    }

    booksCache =
      Array.isArray(books)
        ? books
        : [];


    if (
      booksCache.length === 0
    ) {

      bookList.innerHTML =
        '<div class="empty">' +
        'В базе пока нет книг.' +
        '</div>';

      return;
    }


    bookList.innerHTML = "";


    booksCache.forEach(
      book => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "book-item";


        if (book.cover_url) {

          const cover =
            document.createElement(
              "img"
            );

          cover.className =
            "book-cover";

          cover.src =
            book.cover_url;

          cover.alt =
            book.title || "";

          item.appendChild(
            cover
          );

        } else {

          const emptyCover =
            document.createElement(
              "div"
            );

          emptyCover.className =
            "no-cover";

          emptyCover.textContent =
            "📖";

          item.appendChild(
            emptyCover
          );
        }


        const data =
          document.createElement(
            "div"
          );

        data.className =
          "book-data";


        const title =
          document.createElement(
            "div"
          );

        title.className =
          "book-title";

        title.textContent =
          book.title;


        const author =
          document.createElement(
            "div"
          );

        author.className =
          "book-author";

        author.textContent =
          book.author;


        const category =
          document.createElement(
            "div"
          );

        category.className =
          "book-category";

        category.textContent =
          book.category;


        data.appendChild(title);
        data.appendChild(author);
        data.appendChild(category);


        if (book.book_url) {

          const epub =
            document.createElement(
              "a"
            );

          epub.className =
            "epub-link";

          epub.href =
            book.book_url;

          epub.target =
            "_blank";

          epub.textContent =
            "📘 Открыть EPUB";

          data.appendChild(
            epub
          );
        }


        const actions =
          document.createElement(
            "div"
          );

        actions.className =
          "book-actions";


        const edit =
          document.createElement(
            "button"
          );

        edit.className =
          "edit";

        edit.textContent =
          "✏️ Изменить";

        edit.onclick =
          () => startEdit(
            book.id
          );


        const remove =
          document.createElement(
            "button"
          );

        remove.className =
          "delete";

        remove.textContent =
          "Удалить";

        remove.onclick =
          () => deleteBook(
            book.id,
            book.title
          );


        actions.appendChild(
          edit
        );

        actions.appendChild(
          remove
        );


        item.appendChild(data);

        item.appendChild(actions);

        bookList.appendChild(
          item
        );

      }
    );


  } catch (error) {

    bookList.innerHTML =
      '<div class="empty">' +
      "Ошибка: " +
      escapeHtml(
        error.message
      ) +
      "</div>";
  }
}


/* НАЧАТЬ РЕДАКТИРОВАНИЕ */

function startEdit(id) {

  const book =
    booksCache.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if (!book) {
    return;
  }


  editingBookId =
    book.id;

  editingCoverUrl =
    book.cover_url || "";

  editingBookUrl =
    book.book_url || "";


  document
    .getElementById("title")
    .value =
    book.title || "";

  document
    .getElementById("author")
    .value =
    book.author || "";

  document
    .getElementById("category")
    .value =
    book.category || "";

  document
    .getElementById("description")
    .value =
    book.description || "";

  document
    .getElementById("coverFile")
    .value = "";

  document
    .getElementById("bookFile")
    .value = "";


  currentCoverInfo.textContent =
    editingCoverUrl
      ? "✓ Текущая обложка сохранена"
      : "Обложки пока нет";


  currentBookInfo.textContent =
    editingBookUrl
      ? "✓ Текущий EPUB сохранён"
      : "EPUB пока нет";


  formTitle.textContent =
    "✏️ Редактировать книгу";

  editingNote.classList.add(
    "show"
  );

  cancelEditButton.classList.add(
    "show"
  );

  saveBookButton.textContent =
    "СОХРАНИТЬ ИЗМЕНЕНИЯ";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* ОТМЕНА РЕДАКТИРОВАНИЯ */

cancelEditButton.addEventListener(
  "click",
  () => {

    resetForm();

    showStatus(
      "Редактирование отменено.",
      "success"
    );

  }
);


/* СБРОС ФОРМЫ */

function resetForm() {

  editingBookId = null;

  editingCoverUrl = "";

  editingBookUrl = "";


  document
    .getElementById("title")
    .value = "";

  document
    .getElementById("author")
    .value = "";

  document
    .getElementById("category")
    .value = "";

  document
    .getElementById("description")
    .value = "";

  document
    .getElementById("coverFile")
    .value = "";

  document
    .getElementById("bookFile")
    .value = "";


  currentCoverInfo.textContent =
    "";

  currentBookInfo.textContent =
    "";


  formTitle.textContent =
     "➕ Добавить книгу";

  editingNote.classList.remove(
    "show"
  );

  cancelEditButton.classList.remove(
    "show"
  );

  saveBookButton.textContent =
    "ДОБАВИТЬ КНИГУ";
}


/* УДАЛИТЬ КНИГУ */

async function deleteBook(
  id,
  title
) {

  const adminKey =
    adminKeyInput
      .value
      .trim();


  if (!adminKey) {

    showStatus(
      "Введите админ-пароль.",
      "error"
    );

    return;
  }


  if (
    !confirm(
      'Удалить книгу "' +
      title +
      '"?'
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        API_URL +
        "/books/" +
        id,
        {
          method: "DELETE",

          headers: {
            "X-Admin-Key":
              adminKey
          }
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.error ||
        result.details ||
        "Ошибка удаления"
      );
    }


    if (
      Number(editingBookId) ===
      Number(id)
    ) {
      resetForm();
    }


    showStatus(
      "Книга удалена ✓",
      "success"
    );


    await loadBooks();


  } catch (error) {

    showStatus(
      error.message,
      "error"
    );
  }
}


/* БЕЗОПАСНЫЙ ТЕКСТ */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent = text;

  return div.innerHTML;
}


loadBooks();

</script>
