<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Читалка — Холодная малышка</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    background:#fbfdff;
    color:#173052;
    overflow:hidden;
}

body.dark{
    background:#17202c;
    color:#eef4fb;
}

.reader{
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:rgba(255,255,255,.97);
    border-bottom:1px solid #e2e9f2;
    z-index:20;
}

body.dark header{
    background:#1d2836;
    border-color:#314052;
}

.back{
    text-decoration:none;
    color:#31577f;
    font-size:28px;
}

body.dark .back{
    color:#dceafa;
}

.book-title{
    text-align:center;
    min-width:0;
    flex:1;
    padding:0 10px;
}

.book-title strong{
    display:block;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.book-title span{
    display:block;
    font-size:10px;
    color:#8395aa;
    margin-top:2px;
}

body.dark .book-title span{
    color:#9fb1c5;
}

.menu-button{
    border:0;
    background:none;
    color:#31577f;
    font-size:24px;
    padding:6px;
}

body.dark .menu-button{
    color:#dceafa;
}

.toolbar{
    height:52px;
    flex-shrink:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding:7px 12px;
    background:#fff;
    border-bottom:1px solid #e4ebf3;
}

body.dark .toolbar{
    background:#1d2836;
    border-color:#314052;
}

.tool{
    border:1px solid #d9e4ef;
    background:#f8fbff;
    color:#31577f;
    min-width:42px;
    height:36px;
    border-radius:12px;
    font-size:15px;
}

body.dark .tool{
    background:#253346;
    border-color:#3b4c61;
    color:#edf5ff;
}

#viewer{
    flex:1;
    min-height:0;
    width:100%;
    position:relative;
    background:#fff;
}

body.dark #viewer{
    background:#17202c;
}

.loading{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#fbfdff;
    z-index:5;
    color:#6e86a0;
    font-size:14px;
    gap:12px;
}

body.dark .loading{
    background:#17202c;
    color:#aabbd0;
}

.spinner{
    width:34px;
    height:34px;
    border:3px solid #e1eaf4;
    border-top-color:#6f9bd0;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.bottom{
    flex-shrink:0;
    padding:8px 14px 13px;
    background:rgba(255,255,255,.98);
    border-top:1px solid #e0e8f1;
}

body.dark .bottom{
    background:#1d2836;
    border-color:#314052;
}

.progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
}

.progress{
    flex:1;
    height:5px;
    border-radius:10px;
    background:#e5edf5;
    overflow:hidden;
}

body.dark .progress{
    background:#35465a;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#6f9bd0;
    transition:width .2s;
}

.percent{
    width:38px;
    text-align:right;
    font-size:11px;
    color:#758aa4;
}

body.dark .percent{
    color:#a6b6c9;
}

.nav-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.nav-button{
    width:48px;
    height:42px;
    border:1px solid #d9e4ef;
    background:white;
    border-radius:50%;
    color:#31577f;
    font-size:20px;
}

body.dark .nav-button{
    background:#253346;
    border-color:#3b4c61;
    color:#edf5ff;
}

.chapter-info{
    text-align:center;
    font-size:11px;
    color:#758aa4;
    max-width:55%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

body.dark .chapter-info{
    color:#a6b6c9;
}

.panel{
    position:fixed;
    inset:0;
    background:rgba(26,42,60,.35);
    z-index:50;
    display:none;
}

.panel.open{
    display:block;
}

.panel-content{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    max-height:75vh;
    overflow:auto;
    background:white;
    border-radius:24px 24px 0 0;
    padding:18px;
}

body.dark .panel-content{
    background:#1d2836;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.panel-header h2{
    font-size:17px;
    margin:0;
}

.close{
    border:0;
    background:#edf4fb;
    width:36px;
    height:36px;
    border-radius:50%;
    font-size:18px;
}

body.dark .close{
    background:#2d3b4e;
    color:white;
}

.toc-item{
    display:block;
    width:100%;
    text-align:left;
    border:0;
    border-bottom:1px solid #edf1f5;
    background:transparent;
    padding:13px 5px;
    color:#294564;
    font-size:14px;
}

body.dark .toc-item{
    color:#e8f1fb;
    border-color:#314052;
}

.settings-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #edf1f5;
}

body.dark .settings-row{
    border-color:#314052;
}

.settings-buttons{
    display:flex;
    gap:8px;
}

.settings-buttons button{
    border:1px solid #d9e4ef;
    background:#f5f9fd;
    color:#31577f;
    border-radius:10px;
    padding:8px 12px;
}

body.dark .settings-buttons button{
    background:#253346;
    color:#edf5ff;
    border-color:#3b4c61;
}

.error{
    text-align:center;
    padding:30px 20px;
    color:#8c5260;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="reader">

<header>

<a class="back" href="cold-baby.html">←</a>

<div class="book-title">
<strong>Холодная малышка</strong>
<span>Карли Робин</span>
</div>

<button class="menu-button" id="settingsButton">
•••
</button>

</header>

<div class="toolbar">

<button class="tool" id="tocButton">
☰
</button>

<button class="tool" id="smallerFont">
A−
</button>

<button class="tool" id="biggerFont">
A+
</button>

<button class="tool" id="themeButton">
☀
</button>

<button class="tool" id="bookmarkButton">
🔖
</button>

</div>

<div id="viewer">

<div class="loading" id="loading">
<div class="spinner"></div>
<div>Открываю книгу...</div>
</div>

</div>

<div class="bottom">

<div class="progress-wrap">

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="percent" id="percent">
0%
</div>

</div>

<div class="nav-controls">

<button class="nav-button" id="prev">
‹
</button>

<div class="chapter-info" id="chapterInfo">
Загрузка...
</div>

<button class="nav-button" id="next">
›
</button>

</div>

</div>

</div>


<div class="panel" id="tocPanel">

<div class="panel-content">

<div class="panel-header">
<h2>Содержание</h2>
<button class="close" data-close="tocPanel">×</button>
</div>

<div id="toc">
Загрузка содержания...
</div>

</div>

</div>


<div class="panel" id="settingsPanel">

<div class="panel-content">

<div class="panel-header">
<h2>Настройки чтения</h2>
<button class="close" data-close="settingsPanel">×</button>
</div>

<div class="settings-row">

<span>Размер текста</span>

<div class="settings-buttons">
<button id="fontMinus">A−</button>
<button id="fontPlus">A+</button>
</div>

</div>

<div class="settings-row">

<span>Тема</span>

<div class="settings-buttons">
<button id="lightTheme">Светлая</button>
<button id="darkTheme">Тёмная</button>
</div>

</div>

<div class="settings-row">

<span>Вернуться к книге</span>

<div class="settings-buttons">
<button onclick="location.href='cold-baby.html'">
Карточка книги
</button>
</div>

</div>

</div>

</div>


<script>

const EPUB_FILE =
encodeURI("Холодная малышка.epub");

const STORAGE_POSITION =
"nocturne-cold-baby-position";

const STORAGE_FONT =
"nocturne-reader-font";

const STORAGE_THEME =
"nocturne-reader-theme";

const STORAGE_BOOKMARK =
"nocturne-cold-baby-bookmark";


let book;
let rendition;
let fontSize =
Number(localStorage.getItem(STORAGE_FONT)) || 100;

let currentTheme =
localStorage.getItem(STORAGE_THEME) || "light";


const loading =
document.getElementById("loading");

const progressBar =
document.getElementById("progressBar");

const percent =
document.getElementById("percent");

const chapterInfo =
document.getElementById("chapterInfo");

const bookmarkButton =
document.getElementById("bookmarkButton");


function applyTheme(){

if(currentTheme === "dark"){

document.body.classList.add("dark");

if(rendition){

rendition.themes.override(
"color",
"#e8eef6"
);

rendition.themes.override(
"background",
"#17202c"
);

}

document.getElementById("themeButton")
.textContent = "☾";

}else{

document.body.classList.remove("dark");

if(rendition){

rendition.themes.override(
"color",
"#26394e"
);

rendition.themes.override(
"background",
"#ffffff"
);

}

document.getElementById("themeButton")
.textContent = "☀";

}

localStorage.setItem(
STORAGE_THEME,
currentTheme
);

}


function applyFont(){

if(!rendition) return;

rendition.themes.fontSize(
fontSize + "%"
);

localStorage.setItem(
STORAGE_FONT,
fontSize
);

}


function changeFont(amount){

fontSize += amount;

if(fontSize < 75){
fontSize = 75;
}

if(fontSize > 180){
fontSize = 180;
}

applyFont();

}


async function openBook(){

try{

book = ePub(EPUB_FILE);

rendition = book.renderTo(
"viewer",
{
width:"100%",
height:"100%",
flow:"paginated",
spread:"none",
manager:"default"
}
);

rendition.themes.default({
body:{
"font-family":
"Georgia, 'Times New Roman', serif",
"line-height":"1.65",
"padding":"0 7%",
"color":"#26394e"
},
p:{
"line-height":"1.65"
}
});

applyFont();
applyTheme();


const savedPosition =
localStorage.getItem(
STORAGE_POSITION
);

if(savedPosition){

await rendition.display(
savedPosition
);

}else{

await rendition.display();

}


loading.style.display =
"none";


try{

await book.locations.generate(
1200
);

updateLocation(
rendition.currentLocation()
);

}catch(e){

console.log(
"Не удалось создать процентную шкалу",
e
);

}


book.loaded.navigation.then(
navigation => {

const toc =
document.getElementById("toc");

toc.innerHTML = "";

navigation.toc.forEach(
item => {

const button =
document.createElement("button");

button.className =
"toc-item";

button.textContent =
item.label;

button.addEventListener(
"click",
async ()=>{

await rendition.display(
item.href
);

closePanel(
"tocPanel"
);

}
);

toc.appendChild(
button
);

}
);

}
);


rendition.on(
"relocated",
location => {

updateLocation(
location
);

const cfi =
location.start.cfi;

localStorage.setItem(
STORAGE_POSITION,
cfi
);

}
);


rendition.on(
"keyup",
event => {

if(event.key === "ArrowLeft"){
rendition.prev();
}

if(event.key === "ArrowRight"){
rendition.next();
}

}
);


}catch(error){

console.error(error);

loading.innerHTML = `
<div class="error">
<strong>Не удалось открыть EPUB.</strong><br><br>
Проверь, что файл
«Холодная малышка.epub»
лежит в корне репозитория
рядом с reader.html.
</div>
`;

}

}


function updateLocation(location){

if(
!location ||
!location.start
){
return;
}


let chapter =
location.start.displayed;

if(chapter){

chapterInfo.textContent =
"Страница " +
chapter.page +
" из " +
chapter.total;

}


try{

if(
book.locations &&
location.start.cfi
){

const value =
book.locations.percentageFromCfi(
location.start.cfi
);

if(
typeof value === "number" &&
!Number.isNaN(value)
){

const p =
Math.round(value * 100);

progressBar.style.width =
p + "%";

percent.textContent =
p + "%";

}

}

}catch(e){}


const bookmark =
localStorage.getItem(
STORAGE_BOOKMARK
);

if(
bookmark &&
bookmark ===
location.start.cfi
){

bookmarkButton.textContent =
"🔖";

}else{

bookmarkButton.textContent =
"♡";

}

}


document.getElementById("prev")
.addEventListener(
"click",
()=>rendition && rendition.prev()
);


document.getElementById("next")
.addEventListener(
"click",
()=>rendition && rendition.next()
);


document.getElementById("smallerFont")
.addEventListener(
"click",
()=>changeFont(-10)
);


document.getElementById("biggerFont")
.addEventListener(
"click",
()=>changeFont(10)
);


document.getElementById("fontMinus")
.addEventListener(
"click",
()=>changeFont(-10)
);


document.getElementById("fontPlus")
.addEventListener(
"click",
()=>changeFont(10)
);


document.getElementById("themeButton")
.addEventListener(
"click",
()=>{

currentTheme =
currentTheme === "light"
? "dark"
: "light";

applyTheme();

}
);


document.getElementById("lightTheme")
.addEventListener(
"click",
()=>{

currentTheme = "light";
applyTheme();

}
);


document.getElementById("darkTheme")
.addEventListener(
"click",
()=>{

currentTheme = "dark";
applyTheme();

}
);


document.getElementById("bookmarkButton")
.addEventListener(
"click",
()=>{

if(!rendition){
return;
}

const location =
rendition.currentLocation();

if(
!location ||
!location.start
){
return;
}

const cfi =
location.start.cfi;

const old =
localStorage.getItem(
STORAGE_BOOKMARK
);

if(old === cfi){

localStorage.removeItem(
STORAGE_BOOKMARK
);

bookmarkButton.textContent =
"♡";

}else{

localStorage.setItem(
STORAGE_BOOKMARK,
cfi
);

bookmarkButton.textContent =
"🔖";

}

}
);


document.getElementById("tocButton")
.addEventListener(
"click",
()=>openPanel("tocPanel")
);


document.getElementById("settingsButton")
.addEventListener(
"click",
()=>openPanel("settingsPanel")
);


function openPanel(id){

document.getElementById(id)
.classList.add("open");

}


function closePanel(id){

document.getElementById(id)
.classList.remove("open");

}


document.querySelectorAll(
"[data-close]"
).forEach(
button=>{

button.addEventListener(
"click",
()=>{

closePanel(
button.dataset.close
);

}
);

}
);


document.querySelectorAll(
".panel"
).forEach(
panel=>{

panel.addEventListener(
"click",
event=>{

if(event.target === panel){

panel.classList.remove(
"open"
);

}

}
);

}
);


let touchStartX = 0;
let touchEndX = 0;

document.getElementById("viewer")
.addEventListener(
"touchstart",
event=>{

touchStartX =
event.changedTouches[0]
.screenX;

},
{
passive:true
}
);


document.getElementById("viewer")
.addEventListener(
"touchend",
event=>{

touchEndX =
event.changedTouches[0]
.screenX;

const distance =
touchEndX - touchStartX;

if(distance > 70){

rendition &&
rendition.prev();

}

if(distance < -70){

rendition &&
rendition.next();

}

},
{
passive:true
}
);


applyTheme();
openBook();

</script>

</body>
  </html>
