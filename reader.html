<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Читалка — Холодная малышка</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#fbfdff;
  color:#173052;
}

body.dark{
  background:#17202c;
  color:#eef4fb;
}

.reader{
  height:100dvh;
  display:flex;
  flex-direction:column;
}

header{
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#fff;
  border-bottom:1px solid #e2e9f2;
  z-index:20;
}

body.dark header{
  background:#1d2836;
  border-color:#314052;
}

.back{
  text-decoration:none;
  color:#31577f;
  font-size:28px;
  width:45px;
}

body.dark .back{
  color:#eaf3ff;
}

.book-title{
  text-align:center;
  flex:1;
}

.book-title strong{
  display:block;
  font-size:14px;
}

.book-title span{
  display:block;
  font-size:10px;
  color:#8798ab;
  margin-top:2px;
}

.menu-button{
  border:0;
  background:none;
  color:#31577f;
  font-size:23px;
  width:45px;
}

body.dark .menu-button{
  color:#eaf3ff;
}

.toolbar{
  height:52px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:6px 10px;
  background:#fff;
  border-bottom:1px solid #e2e9f2;
}

body.dark .toolbar{
  background:#1d2836;
  border-color:#314052;
}

.tool{
  width:60px;
  height:38px;
  border:1px solid #d9e4ef;
  background:#f8fbff;
  color:#31577f;
  border-radius:13px;
  font-size:16px;
}

body.dark .tool{
  background:#263548;
  border-color:#405166;
  color:#f2f7fc;
}

.viewer-wrap{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}

#viewer{
  position:absolute;
  inset:0;
  background:#fff;
}

body.dark #viewer{
  background:#17202c;
}

.loading{
  position:absolute;
  inset:0;
  z-index:15;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#fbfdff;
  color:#70859d;
  gap:12px;
}

body.dark .loading{
  background:#17202c;
  color:#aabbd0;
}

.spinner{
  width:34px;
  height:34px;
  border:3px solid #e2ebf4;
  border-top-color:#6f9bd0;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.bottom{
  flex-shrink:0;
  background:#fff;
  border-top:1px solid #dfe8f1;
  padding:10px 18px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 18px rgba(44,75,110,.07);
  z-index:30;
}

body.dark .bottom{
  background:#1d2836;
  border-color:#314052;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.progress{
  flex:1;
  height:6px;
  background:#e4edf5;
  border-radius:10px;
  overflow:hidden;
}

body.dark .progress{
  background:#35465a;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#6f9bd0,#d49ab5);
}

.percent{
  width:42px;
  text-align:right;
  font-size:12px;
  font-weight:bold;
  color:#6481a1;
}

.nav-controls{
  display:grid;
  grid-template-columns:64px 1fr 64px;
  align-items:center;
  gap:12px;
}

.nav-button{
  width:58px;
  height:52px;
  justify-self:center;
  border:1px solid #b9cee3;
  background:#eef5fc;
  border-radius:18px;
  color:#31577f;
  font-size:34px;
}

body.dark .nav-button{
  background:#263548;
  border-color:#4a6077;
  color:#edf5ff;
}

.center-info{
  text-align:center;
}

.chapter-info{
  font-size:12px;
  font-weight:600;
  color:#65809e;
}

.hint{
  font-size:9px;
  color:#a1afbe;
  margin-top:4px;
}

.quote-panel{
  position:fixed;
  left:12px;
  right:12px;
  bottom:105px;
  z-index:100;
  background:white;
  border:1px solid #dce7f2;
  border-radius:18px;
  box-shadow:0 12px 35px rgba(32,57,83,.18);
  padding:14px;
  display:none;
}

.quote-panel.show{
  display:block;
}

body.dark .quote-panel{
  background:#253346;
  border-color:#405166;
}

.quote-preview{
  font-family:Georgia,serif;
  font-size:13px;
  line-height:1.5;
  max-height:80px;
  overflow:hidden;
  margin-bottom:12px;
}

.quote-actions{
  display:flex;
  gap:8px;
}

.quote-save{
  flex:1;
  border:0;
  background:#6f9bd0;
  color:white;
  padding:11px;
  border-radius:11px;
  font-weight:bold;
}

.quote-cancel{
  border:1px solid #d9e4ef;
  background:white;
  color:#5d7693;
  padding:11px 14px;
  border-radius:11px;
}

body.dark .quote-cancel{
  background:#263548;
  border-color:#4a6077;
  color:white;
}

.panel{
  position:fixed;
  inset:0;
  background:rgba(24,40,58,.4);
  z-index:60;
  display:none;
}

.panel.open{
  display:block;
}

.panel-content{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-height:75vh;
  overflow:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}

body.dark .panel-content{
  background:#1d2836;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#edf4fb;
  font-size:18px;
}

.toc-item{
  width:100%;
  border:0;
  border-bottom:1px solid #edf1f5;
  background:transparent;
  text-align:left;
  padding:13px 5px;
  color:#294564;
  font-size:14px;
}

body.dark .toc-item{
  color:#e8f1fb;
  border-color:#314052;
}
</style>
</head>

<body>

<div class="reader">

<header>

<a
class="back"
href="https://tvorchestvolana-alt.github.io/nocturne-books/cold-baby.html"
>
←
</a>

<div class="book-title">
<strong>Холодная малышка</strong>
<span>Карли Робин</span>
</div>

<button class="menu-button">
•••
</button>

</header>

<div class="toolbar">

<button class="tool" id="tocButton">☰</button>
<button class="tool" id="smallerFont">A−</button>
<button class="tool" id="biggerFont">A+</button>
<button class="tool" id="themeButton">☀</button>

</div>

<div class="viewer-wrap">

<div id="viewer"></div>

<div class="loading" id="loading">

<div class="spinner"></div>

<div>
Открываю книгу...
</div>

</div>

</div>

<div class="bottom">

<div class="progress-row">

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="percent" id="percent">
0%
</div>

</div>

<div class="nav-controls">

<button class="nav-button" id="prev">‹</button>

<div class="center-info">

<div class="chapter-info" id="chapterInfo">
Загрузка...
</div>

<div class="hint">
выдели текст пальцем, чтобы сохранить цитату
</div>

</div>

<button class="nav-button" id="next">›</button>

</div>

</div>

</div>

<div class="quote-panel" id="quotePanel">

<div class="quote-preview" id="quotePreview"></div>

<div class="quote-actions">

<button class="quote-save" id="saveQuote">
СОХРАНИТЬ ЦИТАТУ
</button>

<button class="quote-cancel" id="cancelQuote">
×
</button>

</div>

</div>

<div class="panel" id="tocPanel">

<div class="panel-content">

<div class="panel-header">

<h2>
Содержание
</h2>

<button class="close" data-close="tocPanel">
×
</button>

</div>

<div id="toc">
Загрузка содержания...
</div>

</div>

</div>

<script>

const EPUB_FILE =
encodeURI("Холодная малышка.epub");

const STORAGE_POSITION =
"nocturne-cold-baby-position";

const STORAGE_PROGRESS =
"nocturne-cold-baby-progress";

const QUOTES_KEY =
"nocturne-cold-baby-quotes";

const STORAGE_FONT =
"nocturne-reader-font";

const STORAGE_THEME =
"nocturne-reader-theme";

let book;
let rendition;

let pendingQuote = null;

let fontSize =
Number(
  localStorage.getItem(STORAGE_FONT)
) || 100;

let currentTheme =
localStorage.getItem(STORAGE_THEME) || "light";

const loading =
document.getElementById("loading");

const progressBar =
document.getElementById("progressBar");

const percent =
document.getElementById("percent");

const chapterInfo =
document.getElementById("chapterInfo");

const quotePanel =
document.getElementById("quotePanel");

const quotePreview =
document.getElementById("quotePreview");


function getQuotes(){

  try{

    return JSON.parse(
      localStorage.getItem(QUOTES_KEY)
    ) || [];

  }catch(e){

    return [];
  }
}


function saveQuotes(quotes){

  localStorage.setItem(
    QUOTES_KEY,
    JSON.stringify(quotes)
  );
}


function applyTheme(){

  if(currentTheme === "dark"){

    document.body.classList.add("dark");

    if(rendition){

      rendition.themes.override(
        "color",
        "#e8eef6"
      );

      rendition.themes.override(
        "background",
        "#17202c"
      );
    }

    document
    .getElementById("themeButton")
    .textContent =
    "☾";

  }else{

    document.body.classList.remove("dark");

    if(rendition){

      rendition.themes.override(
        "color",
        "#26394e"
      );

      rendition.themes.override(
        "background",
        "#ffffff"
      );
    }

    document
    .getElementById("themeButton")
    .textContent =
    "☀";
  }

  localStorage.setItem(
    STORAGE_THEME,
    currentTheme
  );
}


function applyFont(){

  if(!rendition){
    return;
  }

  rendition.themes.fontSize(
    fontSize + "%"
  );

  localStorage.setItem(
    STORAGE_FONT,
    fontSize
  );
}


function changeFont(amount){

  fontSize += amount;

  if(fontSize < 75){
    fontSize = 75;
  }

  if(fontSize > 180){
    fontSize = 180;
  }

  applyFont();
}


async function openBook(){

  try{

    book =
    ePub(EPUB_FILE);

    rendition =
    book.renderTo(
      "viewer",
      {
        width:"100%",
        height:"100%",
        flow:"paginated",
        spread:"none",
        manager:"default"
      }
    );

    rendition.themes.default({

      body:{
        "font-family":
        "Georgia, 'Times New Roman', serif",
        "line-height":"1.65",
        "padding":"0 7%",
        "color":"#26394e"
      },

      p:{
        "line-height":"1.65"
      },

      "::selection":{
        "background":
        "rgba(221,161,188,.32)"
      }

    });

    applyFont();
    applyTheme();

    const params =
    new URLSearchParams(location.search);

    const quoteId =
    params.get("quote");

    let startPosition = null;


    if(quoteId){

      const quote =
      getQuotes()
      .find(
        item =>
        String(item.id) === quoteId
      );

      if(quote){
        startPosition = quote.cfi;
      }
    }


    if(!startPosition){

      startPosition =
      localStorage.getItem(
        STORAGE_POSITION
      );
    }


    if(startPosition){

      await rendition.display(
        startPosition
      );

    }else{

      await rendition.display();
    }


    loading.style.display =
    "none";


    try{

      await book.locations.generate(
        1200
      );

      updateLocation(
        rendition.currentLocation()
      );

    }catch(e){}


    book.loaded.navigation.then(
    navigation=>{

      const toc =
      document.getElementById("toc");

      toc.innerHTML="";

      navigation.toc.forEach(
      item=>{

        const button =
        document.createElement("button");

        button.className =
        "toc-item";

        button.textContent =
        item.label;

        button.onclick =
        async()=>{

          await rendition.display(
            item.href
          );

          closePanel("tocPanel");
        };

        toc.appendChild(button);

      });

    });


    rendition.on(
      "relocated",
      location=>{

        updateLocation(location);

        if(location?.start?.cfi){

          localStorage.setItem(
            STORAGE_POSITION,
            location.start.cfi
          );

          /* ВОТ ЭТО ГЛАВНОЕ ДОБАВЛЕНИЕ */

          localStorage.setItem(
            "nocturne-last-book",
            "cold-baby"
          );
        }
      }
    );


    rendition.on(
      "selected",
      async function(cfiRange){

        try{

          const range =
          await book.getRange(
            cfiRange
          );

          const text =
          range
          ? range.toString().trim()
          : "";

          if(!text){
            return;
          }

          const currentProgress =
          Number(
            localStorage.getItem(
              STORAGE_PROGRESS
            )
          ) || 0;

          pendingQuote = {

            id:
            Date.now(),

            text:
            text,

            cfi:
            cfiRange,

            progress:
            currentProgress,

            book:
            "cold-baby",

            bookTitle:
            "Холодная малышка",

            author:
            "Карли Робин"
          };

          quotePreview.textContent =
          "«" +
          text +
          "»";

          quotePanel
          .classList
          .add("show");

        }catch(e){

          console.log(e);
        }
      }
    );


    getQuotes().forEach(
    quote=>{

      try{

        rendition.annotations.highlight(
          quote.cfi,
          {}
        );

      }catch(e){}

    });


  }catch(error){

    console.error(error);

    loading.innerHTML =
    "<div>Не удалось открыть EPUB.</div>";
  }
}


function updateLocation(location){

  if(!location?.start){
    return;
  }

  if(location.start.displayed){

    chapterInfo.textContent =
    "Страница " +
    location.start.displayed.page +
    " из " +
    location.start.displayed.total;
  }

  try{

    if(
      book.locations &&
      location.start.cfi
    ){

      const value =
      book.locations
      .percentageFromCfi(
        location.start.cfi
      );

      if(
        typeof value === "number" &&
        !Number.isNaN(value)
      ){

        const p =
        Math.round(
          value * 100
        );

        progressBar.style.width =
        p + "%";

        percent.textContent =
        p + "%";

        localStorage.setItem(
          STORAGE_PROGRESS,
          p
        );
      }
    }

  }catch(e){}
}


document
.getElementById("saveQuote")
.onclick =
()=>{

  if(!pendingQuote){
    return;
  }

  const quotes =
  getQuotes();

  quotes.unshift(
    pendingQuote
  );

  saveQuotes(quotes);

  try{

    rendition.annotations.highlight(
      pendingQuote.cfi,
      {}
    );

  }catch(e){}

  pendingQuote =
  null;

  quotePanel
  .classList
  .remove("show");
};


document
.getElementById("cancelQuote")
.onclick =
()=>{

  pendingQuote = null;

  quotePanel
  .classList
  .remove("show");
};


document
.getElementById("prev")
.onclick =
()=>{

  if(rendition){
    rendition.prev();
  }
};


document
.getElementById("next")
.onclick =
()=>{

  if(rendition){
    rendition.next();
  }
};


document
.getElementById("smallerFont")
.onclick =
()=>changeFont(-10);


document
.getElementById("biggerFont")
.onclick =
()=>changeFont(10);


document
.getElementById("themeButton")
.onclick =
()=>{

  currentTheme =
  currentTheme === "light"
  ? "dark"
  : "light";

  applyTheme();
};


document
.getElementById("tocButton")
.onclick =
()=>openPanel("tocPanel");


function openPanel(id){

  document
  .getElementById(id)
  .classList
  .add("open");
}


function closePanel(id){

  document
  .getElementById(id)
  .classList
  .remove("open");
}


document
.querySelectorAll("[data-close]")
.forEach(
button=>{

  button.onclick =
  ()=>closePanel(
    button.dataset.close
  );

});


applyTheme();
openBook();

</script>

</body>
</html>
