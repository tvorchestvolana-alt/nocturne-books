<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Читалка — Холодная малышка</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#fbfdff;
  color:#173052;
}

body.dark{
  background:#17202c;
  color:#eef4fb;
}

.reader{
  height:100dvh;
  display:flex;
  flex-direction:column;
}

header{
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#fff;
  border-bottom:1px solid #e2e9f2;
  z-index:20;
}

body.dark header{
  background:#1d2836;
  border-color:#314052;
}

.back{
  text-decoration:none;
  color:#31577f;
  font-size:28px;
  width:45px;
}

body.dark .back{
  color:#eaf3ff;
}

.book-title{
  text-align:center;
  flex:1;
  min-width:0;
}

.book-title strong{
  display:block;
  font-size:14px;
}

.book-title span{
  display:block;
  font-size:10px;
  color:#8798ab;
  margin-top:2px;
}

.menu-button{
  border:0;
  background:none;
  color:#31577f;
  font-size:23px;
  width:45px;
}

body.dark .menu-button{
  color:#eaf3ff;
}

.toolbar{
  height:52px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:6px 10px;
  background:#fff;
  border-bottom:1px solid #e2e9f2;
  z-index:20;
}

body.dark .toolbar{
  background:#1d2836;
  border-color:#314052;
}

.tool{
  width:54px;
  height:38px;
  border:1px solid #d9e4ef;
  background:#f8fbff;
  color:#31577f;
  border-radius:13px;
  font-size:16px;
}

body.dark .tool{
  background:#263548;
  border-color:#405166;
  color:#f2f7fc;
}

.viewer-wrap{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}

#viewer{
  position:absolute;
  inset:0;
  background:#fff;
}

body.dark #viewer{
  background:#17202c;
}

.tap-zone{
  position:absolute;
  top:0;
  bottom:0;
  width:28%;
  z-index:8;
}

#leftZone{left:0}
#rightZone{right:0}

.loading{
  position:absolute;
  inset:0;
  z-index:15;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#fbfdff;
  color:#70859d;
  gap:12px;
}

body.dark .loading{
  background:#17202c;
  color:#aabbd0;
}

.spinner{
  width:34px;
  height:34px;
  border:3px solid #e2ebf4;
  border-top-color:#6f9bd0;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.bottom{
  flex-shrink:0;
  background:#fff;
  border-top:1px solid #dfe8f1;
  padding:10px 18px calc(12px + env(safe-area-inset-bottom));
  z-index:30;
  box-shadow:0 -4px 18px rgba(44,75,110,.07);
}

body.dark .bottom{
  background:#1d2836;
  border-color:#314052;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.progress{
  flex:1;
  height:6px;
  background:#e4edf5;
  border-radius:10px;
  overflow:hidden;
}

body.dark .progress{
  background:#35465a;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#6f9bd0;
}

.percent{
  width:42px;
  text-align:right;
  font-size:12px;
  font-weight:bold;
  color:#6481a1;
}

body.dark .percent{
  color:#b8c8d9;
}

.nav-controls{
  display:grid;
  grid-template-columns:64px 1fr 64px;
  align-items:center;
  gap:12px;
}

.nav-button{
  width:58px;
  height:52px;
  justify-self:center;
  border:1px solid #b9cee3;
  background:#eef5fc;
  border-radius:18px;
  color:#31577f;
  font-size:34px;
  line-height:1;
}

body.dark .nav-button{
  background:#263548;
  border-color:#4a6077;
  color:#edf5ff;
}

.center-info{
  text-align:center;
  min-width:0;
}

.chapter-info{
  font-size:12px;
  font-weight:600;
  color:#65809e;
}

.hint{
  font-size:9px;
  color:#a1afbe;
  margin-top:4px;
}

.panel{
  position:fixed;
  inset:0;
  background:rgba(24,40,58,.4);
  z-index:60;
  display:none;
}

.panel.open{
  display:block;
}

.panel-content{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-height:75vh;
  overflow:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}

body.dark .panel-content{
  background:#1d2836;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.panel-header h2{
  margin:0;
  font-size:17px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#edf4fb;
  font-size:18px;
}

body.dark .close{
  background:#2d3b4e;
  color:#fff;
}

.toc-item{
  width:100%;
  border:0;
  border-bottom:1px solid #edf1f5;
  background:transparent;
  text-align:left;
  padding:13px 5px;
  color:#294564;
  font-size:14px;
}

body.dark .toc-item{
  color:#e8f1fb;
  border-color:#314052;
}

.settings-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #edf1f5;
}

body.dark .settings-row{
  border-color:#314052;
}

.settings-buttons{
  display:flex;
  gap:8px;
}

.settings-buttons button{
  border:1px solid #d9e4ef;
  background:#f5f9fd;
  color:#31577f;
  border-radius:10px;
  padding:8px 11px;
}

body.dark .settings-buttons button{
  background:#263548;
  border-color:#405166;
  color:#edf5ff;
}
</style>
</head>

<body>

<div class="reader">

<header>
<a class="back" href="cold-baby.html">←</a>

<div class="book-title">
<strong>Холодная малышка</strong>
<span>Карли Робин</span>
</div>

<button class="menu-button" id="settingsButton">•••</button>
</header>

<div class="toolbar">
<button class="tool" id="tocButton">☰</button>
<button class="tool" id="smallerFont">A−</button>
<button class="tool" id="biggerFont">A+</button>
<button class="tool" id="themeButton">☀</button>
<button class="tool" id="bookmarkButton">♡</button>
</div>

<div class="viewer-wrap">
<div id="viewer"></div>
<div class="tap-zone" id="leftZone"></div>
<div class="tap-zone" id="rightZone"></div>

<div class="loading" id="loading">
<div class="spinner"></div>
<div>Открываю книгу...</div>
</div>
</div>

<div class="bottom">

<div class="progress-row">
<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="percent" id="percent">0%</div>
</div>

<div class="nav-controls">

<button class="nav-button" id="prev">‹</button>

<div class="center-info">
<div class="chapter-info" id="chapterInfo">Загрузка...</div>
<div class="hint">тап слева / справа</div>
</div>

<button class="nav-button" id="next">›</button>

</div>

</div>

</div>

<div class="panel" id="tocPanel">
<div class="panel-content">

<div class="panel-header">
<h2>Содержание</h2>
<button class="close" data-close="tocPanel">×</button>
</div>

<div id="toc">Загрузка содержания...</div>

</div>
</div>

<div class="panel" id="settingsPanel">
<div class="panel-content">

<div class="panel-header">
<h2>Настройки чтения</h2>
<button class="close" data-close="settingsPanel">×</button>
</div>

<div class="settings-row">
<span>Размер текста</span>
<div class="settings-buttons">
<button id="fontMinus">A−</button>
<button id="fontPlus">A+</button>
</div>
</div>

<div class="settings-row">
<span>Тема</span>
<div class="settings-buttons">
<button id="lightTheme">Светлая</button>
<button id="darkTheme">Тёмная</button>
</div>
</div>

</div>
</div>

<script>

const EPUB_FILE = encodeURI("Холодная малышка.epub");

const STORAGE_POSITION = "nocturne-cold-baby-position";
const STORAGE_PROGRESS = "nocturne-cold-baby-progress";
const STORAGE_FONT = "nocturne-reader-font";
const STORAGE_THEME = "nocturne-reader-theme";

const STORAGE_BOOKMARK_CFI = "nocturne-cold-baby-bookmark";
const STORAGE_BOOKMARK_PROGRESS = "nocturne-cold-baby-bookmark-progress";
const STORAGE_BOOKMARK_PAGE = "nocturne-cold-baby-bookmark-page";

let book;
let rendition;

let fontSize = Number(localStorage.getItem(STORAGE_FONT)) || 100;
let currentTheme = localStorage.getItem(STORAGE_THEME) || "light";

const loading = document.getElementById("loading");
const progressBar = document.getElementById("progressBar");
const percent = document.getElementById("percent");
const chapterInfo = document.getElementById("chapterInfo");
const bookmarkButton = document.getElementById("bookmarkButton");

function applyTheme(){

if(currentTheme==="dark"){

document.body.classList.add("dark");

if(rendition){
rendition.themes.override("color","#e8eef6");
rendition.themes.override("background","#17202c");
}

document.getElementById("themeButton").textContent="☾";

}else{

document.body.classList.remove("dark");

if(rendition){
rendition.themes.override("color","#26394e");
rendition.themes.override("background","#ffffff");
}

document.getElementById("themeButton").textContent="☀";
}

localStorage.setItem(STORAGE_THEME,currentTheme);
}

function applyFont(){

if(!rendition) return;

rendition.themes.fontSize(fontSize+"%");
localStorage.setItem(STORAGE_FONT,fontSize);
}

function changeFont(amount){

fontSize+=amount;

if(fontSize<75) fontSize=75;
if(fontSize>180) fontSize=180;

applyFont();
}

async function openBook(){

try{

book=ePub(EPUB_FILE);

rendition=book.renderTo("viewer",{
width:"100%",
height:"100%",
flow:"paginated",
spread:"none",
manager:"default"
});

rendition.themes.default({
body:{
"font-family":"Georgia, 'Times New Roman', serif",
"line-height":"1.65",
"padding":"0 7%",
"color":"#26394e"
},
p:{
"line-height":"1.65"
}
});

applyFont();
applyTheme();

const params = new URLSearchParams(location.search);
const openBookmark = params.get("bookmark");

const savedPosition =
openBookmark === "1"
? localStorage.getItem(STORAGE_BOOKMARK_CFI)
: localStorage.getItem(STORAGE_POSITION);

if(savedPosition){
await rendition.display(savedPosition);
}else{
await rendition.display();
}

loading.style.display="none";

try{
await book.locations.generate(1200);
updateLocation(rendition.currentLocation());
}catch(e){}

book.loaded.navigation.then(navigation=>{

const toc=document.getElementById("toc");
toc.innerHTML="";

navigation.toc.forEach(item=>{

const button=document.createElement("button");
button.className="toc-item";
button.textContent=item.label;

button.addEventListener("click",async()=>{

await rendition.display(item.href);
closePanel("tocPanel");

});

toc.appendChild(button);

});

});

rendition.on("relocated",location=>{

updateLocation(location);

if(location?.start?.cfi){

localStorage.setItem(
STORAGE_POSITION,
location.start.cfi
);

}

});

}catch(error){

loading.innerHTML =
"<div>Не удалось открыть EPUB.</div>";

}
}

function updateLocation(location){

if(!location?.start) return;

let currentPageText="";

if(location.start.displayed){

currentPageText =
"Страница " +
location.start.displayed.page +
" из " +
location.start.displayed.total;

chapterInfo.textContent=currentPageText;
}

try{

if(book.locations && location.start.cfi){

const value=
book.locations.percentageFromCfi(location.start.cfi);

if(typeof value==="number" && !Number.isNaN(value)){

const p=Math.round(value*100);

progressBar.style.width=p+"%";
percent.textContent=p+"%";

localStorage.setItem(
STORAGE_PROGRESS,
p
);

}

}

}catch(e){}

const savedBookmark =
localStorage.getItem(STORAGE_BOOKMARK_CFI);

bookmarkButton.textContent =
savedBookmark===location.start.cfi
? "🔖"
: "♡";
}

function nextPage(){
if(rendition) rendition.next();
}

function prevPage(){
if(rendition) rendition.prev();
}

document.getElementById("prev").onclick=prevPage;
document.getElementById("next").onclick=nextPage;

document.getElementById("leftZone").onclick=prevPage;
document.getElementById("rightZone").onclick=nextPage;

document.getElementById("smallerFont").onclick=()=>changeFont(-10);
document.getElementById("biggerFont").onclick=()=>changeFont(10);

document.getElementById("fontMinus").onclick=()=>changeFont(-10);
document.getElementById("fontPlus").onclick=()=>changeFont(10);

document.getElementById("themeButton").onclick=()=>{

currentTheme =
currentTheme==="light"
? "dark"
: "light";

applyTheme();
};

document.getElementById("lightTheme").onclick=()=>{

currentTheme="light";
applyTheme();

};

document.getElementById("darkTheme").onclick=()=>{

currentTheme="dark";
applyTheme();

};

bookmarkButton.onclick=()=>{

if(!rendition) return;

const location=rendition.currentLocation();

if(!location?.start?.cfi) return;

const cfi=location.start.cfi;

const old =
localStorage.getItem(STORAGE_BOOKMARK_CFI);

if(old===cfi){

localStorage.removeItem(STORAGE_BOOKMARK_CFI);
localStorage.removeItem(STORAGE_BOOKMARK_PROGRESS);
localStorage.removeItem(STORAGE_BOOKMARK_PAGE);

bookmarkButton.textContent="♡";

}else{

localStorage.setItem(
STORAGE_BOOKMARK_CFI,
cfi
);

const savedProgress =
localStorage.getItem(STORAGE_PROGRESS) || "0";

localStorage.setItem(
STORAGE_BOOKMARK_PROGRESS,
savedProgress
);

const pageText =
chapterInfo.textContent || "Сохранённое место";

localStorage.setItem(
STORAGE_BOOKMARK_PAGE,
pageText
);

bookmarkButton.textContent="🔖";
}

};

document.getElementById("tocButton").onclick=
()=>openPanel("tocPanel");

document.getElementById("settingsButton").onclick=
()=>openPanel("settingsPanel");

function openPanel(id){
document.getElementById(id).classList.add("open");
}

function closePanel(id){
document.getElementById(id).classList.remove("open");
}

document.querySelectorAll("[data-close]")
.forEach(button=>{

button.onclick=()=>{
closePanel(button.dataset.close);
};

});

document.querySelectorAll(".panel")
.forEach(panel=>{

panel.onclick=event=>{

if(event.target===panel){
panel.classList.remove("open");
}

};

});

applyTheme();
openBook();

</script>

</body>
</html>
