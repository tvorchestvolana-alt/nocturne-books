<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#173052;
  padding-bottom:110px;

  background:
    radial-gradient(circle at 5% 12%,rgba(244,190,211,.38) 0%,transparent 25%),
    radial-gradient(circle at 95% 30%,rgba(187,211,238,.26) 0%,transparent 27%),
    radial-gradient(circle at 10% 60%,rgba(247,202,220,.30) 0%,transparent 29%),
    radial-gradient(circle at 90% 78%,rgba(222,197,226,.25) 0%,transparent 27%),
    linear-gradient(180deg,#fffafd 0%,#fbf5f9 40%,#f7f7fc 72%,#f4f8fc 100%);

  background-attachment:fixed;
}

body::before{
  content:"✦";
  position:fixed;
  top:180px;
  left:10px;
  color:rgba(207,145,174,.20);
  font-size:20px;
  pointer-events:none;
}

body::after{
  content:"☾";
  position:fixed;
  right:12px;
  top:470px;
  color:rgba(111,155,208,.15);
  font-size:27px;
  pointer-events:none;
}

header{
  padding:24px 18px 14px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(220,221,233,.85);
  position:sticky;
  top:0;
  z-index:10;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.back{
  text-decoration:none;
  color:#31577f;
  font-size:28px;
}

.title{
  font-weight:800;
  font-size:22px;
}

.search{
  width:100%;
  border:1px solid rgba(216,225,237,.9);
  background:rgba(255,255,255,.88);
  padding:15px 16px;
  border-radius:17px;
  font-size:15px;
  outline:none;
  box-shadow:0 6px 18px rgba(82,103,132,.05);
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:14px 0 4px;
}

.filter{
  border:1px solid rgba(211,224,237,.9);
  background:rgba(255,255,255,.88);
  color:#31577f;
  padding:9px 14px;
  border-radius:20px;
  white-space:nowrap;
}

.filter.active{
  background:linear-gradient(135deg,#709bd0,#d49ab5);
  color:white;
  border-color:transparent;
}

main{
  padding:20px 16px;
  max-width:700px;
  margin:auto;
}

.count{
  font-size:12px;
  color:#7d90a7;
  margin-bottom:15px;
}

.books{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px 16px;
}

.book{
  text-decoration:none;
  color:inherit;
}

.cover-wrap{
  position:relative;
}

.cover{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:17px;
  box-shadow:
    0 9px 24px rgba(42,70,105,.13),
    0 4px 16px rgba(217,154,184,.08);
  display:block;
}

.heart{
  position:absolute;
  right:10px;
  top:10px;
  width:36px;
  height:36px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(6px);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  color:#31577f;
}

.series-number{
  position:absolute;
  left:10px;
  top:10px;
  background:rgba(255,255,255,.92);
  color:#52779e;
  border-radius:12px;
  padding:6px 8px;
  font-size:10px;
  font-weight:bold;
}

.book h3{
  font-size:15px;
  margin:10px 0 4px;
}

.author{
  font-size:12px;
  color:#8192a7;
  margin-bottom:5px;
}

.series{
  font-size:11px;
  color:#6f89a5;
  margin-bottom:8px;
}

.tropes{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.trope{
  font-size:10px;
  padding:5px 8px;
  border-radius:13px;
  background:linear-gradient(135deg,#eaf2fb,#f8eaf1);
  color:#52779e;
}

.empty{
  display:none;
  grid-column:1/-1;
  text-align:center;
  padding:60px 10px;
  color:#8192a7;
}

nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:space-around;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-top:1px solid #e0e8f1;
  padding:9px 3px calc(13px + env(safe-area-inset-bottom));
  z-index:999999;
}

.nav-item{
  width:20%;
  min-height:54px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  text-align:center;
  color:#8ca0b8;
  font-size:10px;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.nav-item.active{
  color:#5285c3;
}
</style>
</head>

<script>

const search=document.getElementById("search");
const books=[...document.querySelectorAll(".book")];
const filters=document.querySelectorAll(".filter");
const empty=document.getElementById("empty");
const count=document.getElementById("count");

let activeFilter="all";

function applyFilters(){

  const query=search.value.toLowerCase().trim();

  let visible=0;

  books.forEach(book=>{

    const data=book.dataset.search.toLowerCase();

    const matchesSearch=
    query==="" ||
    data.includes(query);

    const matchesFilter=
    activeFilter==="all" ||
    data.includes(activeFilter);

    if(matchesSearch && matchesFilter){

      book.style.display="block";
      visible++;

    }else{

      book.style.display="none";
    }
  });

  empty.style.display=
  visible===0
  ? "block"
  : "none";

  count.textContent=
  visible===1
  ? "1 книга"
  : visible+" книг";
}

search.addEventListener("input",applyFilters);

filters.forEach(button=>{

  button.addEventListener("click",()=>{

    filters.forEach(
      b=>b.classList.remove("active")
    );

    button.classList.add("active");

    activeFilter=
    button.dataset.filter;

    applyFilters();
  });

});

</script>
